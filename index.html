<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>足球回家 · 1966</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1628;color:#fff;height:100vh;overflow:hidden;user-select:none}
#app{width:100%;max-width:430px;height:100vh;margin:0 auto;position:relative;overflow:hidden}
#hud{position:absolute;top:0;left:0;right:0;z-index:100;padding:10px 14px 8px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
#hc{font-size:11px;color:#aaa;letter-spacing:1px}
#ht{font-size:13px;font-weight:bold;margin:2px 0 6px}
#sbw{height:3px;background:rgba(255,255,255,.15);border-radius:2px}
#sb{height:3px;background:linear-gradient(90deg,#f0c040,#e8a020);border-radius:2px;transition:width .5s;width:0%}
#bg{position:absolute;inset:0;transition:background 1.2s}
#db{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.75));padding:14px 16px 22px;min-height:145px;z-index:60;cursor:pointer}
#sp{font-size:12px;color:#f0c040;font-weight:bold;margin-bottom:5px;min-height:16px}
#dt{font-size:15px;line-height:1.75;min-height:64px}
#th{position:absolute;bottom:7px;right:14px;font-size:11px;color:rgba(255,255,255,.35);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}
#cp{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px}
#cq{font-size:16px;font-weight:bold;text-align:center;margin-bottom:22px;line-height:1.65;color:#f0c040}
.cb{width:100%;max-width:370px;padding:13px 16px;margin:7px 0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:16px;cursor:pointer;text-align:left;line-height:1.4}
.cb.sel{background:rgba(240,192,64,.2);border-color:#f0c040}
#ov{position:absolute;inset:0;z-index:150;display:none;overflow-y:auto;padding:56px 16px 24px;background:rgba(0,0,0,.92)}
#ovc{position:fixed;top:14px;right:14px;font-size:22px;cursor:pointer;z-index:160;background:rgba(0,0,0,.5);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
#ep{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0a1628;padding:24px;text-align:center;overflow-y:auto}
.eb{font-size:64px;margin-bottom:14px}
.et{font-size:22px;font-weight:bold;color:#f0c040;margin-bottom:8px}
.ed{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:6px}
.es{font-size:13px;color:#666;margin-bottom:18px}
.cl{text-align:left;width:100%;max-width:360px;margin-bottom:20px}
.ci{font-size:12px;color:#777;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);line-height:1.5}
.ci span{color:#f0c040}
.rb{padding:12px 36px;background:#f0c040;color:#000;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.sec{font-size:12px;color:#666;letter-spacing:1px;margin:14px 0 8px}
.sbd{background:linear-gradient(135deg,#0d2a0d,#1a3a1a);border:1px solid #2a5a2a;border-radius:12px;padding:14px;margin:6px 0}
.sm{text-align:center;font-size:11px;color:#888;margin-bottom:10px}
.sr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.st{text-align:center;flex:1}
.sn{font-size:12px;color:#aaa}
.ss{font-size:38px;font-weight:bold;color:#f0c040}
.sv{font-size:13px;color:#555}
.se{font-size:13px;color:#ccc;text-align:center;padding:8px;background:rgba(255,255,255,.04);border-radius:6px}
.cmw{background:rgba(255,255,255,.04);border-radius:10px;padding:10px}
.cm{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.cm:last-child{border:none}
.cu{font-size:12px;color:#f0c040;margin-bottom:3px}
.ct{font-size:13px;color:#ddd;line-height:1.5}
.ck{font-size:11px;color:#666;margin-top:3px}
.tl{padding:6px 0}
.tr{display:flex;gap:10px;padding:7px 0}
.td{width:9px;height:9px;border-radius:50%;background:#f0c040;margin-top:5px;flex-shrink:0}
.ty{font-size:12px;color:#f0c040;font-weight:bold;min-width:56px}
.tt{font-size:13px;color:#ccc;line-height:1.5}
.hw{text-align:center;padding:24px 0}
.he{font-size:72px;margin-bottom:12px}
.hti{font-size:20px;font-weight:bold;color:#f0c040;margin-bottom:8px}
.hs{font-size:13px;color:#aaa;line-height:1.7;white-space:pre-line}
.crd{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(240,192,64,.3);border-radius:12px;padding:14px}
.crt{font-size:12px;color:#f0c040;margin-bottom:8px}
.crx{font-size:13px;color:#ccc;line-height:1.7;margin-bottom:10px;white-space:pre-line}
.cre{font-size:12px;color:#666;font-style:italic;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
.pf{background:rgba(255,255,255,.04);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.pe{font-size:44px;flex-shrink:0}
.pn{font-size:15px;font-weight:bold;color:#f0c040;margin-bottom:5px}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tg{font-size:11px;padding:2px 7px;background:rgba(240,192,64,.12);border:1px solid rgba(240,192,64,.25);border-radius:10px;color:#f0c040}
.pb{font-size:12px;color:#aaa;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><div id="hc">懂球帝 · 世界杯史话</div><div id="ht">足球回家 · 1966</div><div id="sbw"><div id="sb"></div></div></div>
  <div id="bg"></div>
  <div id="db"><div id="sp"></div><div id="dt">点击任意处开始</div><div id="th">点击继续 ▶</div></div>
  <div id="cp"><div id="cq"></div><div id="cbs"></div></div>
  <div id="ov"><div id="ovc">✕</div><div id="ovcon"></div></div>
  <div id="ep"></div>
</div>
<script>
var idx=0,score=0,clog=[],typing=null,locked=false;
var bg=document.getElementById('bg'),sp=document.getElementById('sp'),dt=document.getElementById('dt');
var db=document.getElementById('db'),cp=document.getElementById('cp'),cq=document.getElementById('cq');
var cbs=document.getElementById('cbs'),ov=document.getElementById('ov'),ovcon=document.getElementById('ovcon');
var ep=document.getElementById('ep'),sb=document.getElementById('sb'),ht=document.getElementById('ht');
document.getElementById('ovc').onclick=function(){ov.style.display='none';db.style.display='block';idx++;advance();};
function upBar(){sb.style.width=Math.min(100,Math.round(score/100*100))+'%';}
function bold(t){return t.replace(/\*\*([^*]+)\*\*/g,'<strong style="color:#f0c040">$1</strong>');}
function typeText(txt){
  if(typing)clearInterval(typing);
  dt.textContent='';
  var plain=txt.replace(/\*\*([^*]+)\*\*/g,'$1'),i=0;
  typing=setInterval(function(){
    if(i<plain.length){dt.textContent+=plain[i++];}
    else{clearInterval(typing);typing=null;dt.innerHTML=bold(txt);}
  },70);
}
function showOv(html){ovcon.innerHTML=html;ov.style.display='block';ov.scrollTop=0;db.style.display='none';}
function sbH(n){return '<div class="sbd"><div class="sm">'+n.minute+'</div><div class="sr"><div class="st"><div class="sn">'+n.home+'</div><div class="ss">'+n.homeScore+'</div></div><div class="sv">VS</div><div class="st"><div class="sn">'+n.away+'</div><div class="ss">'+n.awayScore+'</div></div></div><div class="se">'+n.event+'</div></div>';}
function cmH(n){return '<div class="cmw">'+n.posts.map(function(p){return '<div class="cm"><div class="cu">@'+p.user+'</div><div class="ct">'+p.text+'</div><div class="ck">👍 '+p.likes.toLocaleString()+'</div></div>';}).join('')+'</div>';}
function tlH(n){return '<div class="tl">'+n.events.map(function(e){return '<div class="tr"><div class="td"></div><div><div class="ty">'+e.year+'</div><div class="tt">'+e.text+'</div></div></div>';}).join('')+'</div>';}
function heroH(n){return '<div class="hw"><div class="he">'+n.emoji+'</div><div class="hti">'+n.title+'</div><div class="hs">'+n.subtitle+'</div></div>';}
function cardH(n){return '<div class="crd"><div class="crt">📁 '+n.title+'</div><div class="crx">'+n.text+'</div><div class="cre">▶ '+n.teaser+'</div></div>';}
function profH(n){return '<div class="pf"><div class="pe">'+n.emoji+'</div><div><div class="pn">'+n.name+'</div><div class="tgs">'+n.tags.map(function(t){return '<span class="tg">'+t+'</span>';}).join('')+'</div><div class="pb">'+n.bio+'</div></div></div>';}
function showEnding(){
  var badge,title,desc;
  if(score>=70){badge='🏆';title='深度理解者';desc='你穿透了表象，看见了那个时代的荣耀与阴影。1966年的故事，在你心中已经完整。';}
  else if(score>=40){badge='🔍';title='真相追寻者';desc='你触碰到了一部分真相。历史的每一个细节都值得深挖，欢迎再来一次。';}
  else{badge='👁️';title='旁观者';desc='每个故事都有更深的一面。足球不只是比赛，欢迎重新探索这段历史。';}
  var logHtml=clog.map(function(c){return '<div class="ci">Q: '+c.q+'<br><span>你选择：'+c.a+'</span></div>';}).join('');
  ep.innerHTML='<div class="eb">'+badge+'</div><div class="et">'+title+'</div><div class="ed">'+desc+'</div><div class="es">理解度：'+score+'/100分</div><div class="cl"><div class="sec">你的选择回顾</div>'+logHtml+'</div><button class="rb" onclick="location.reload()">重新体验</button>';
  ep.style.display='flex';
}
function advance(){
  if(locked)return;
  var node=script[idx];if(!node)return;
  if(typing){clearInterval(typing);typing=null;dt.innerHTML=bold(node.text||'');return;}
  ov.style.display='none';db.style.display='block';
  if(node.type==='scene'){bg.style.background=node.bg.startsWith("data:")?"url("+node.bg+") center/cover no-repeat":node.bg;ht.textContent=node.chapter;idx++;advance();return;}
  if(node.type==='narrate'){sp.textContent='';typeText(node.text);idx++;return;}
  if(node.type==='dialog'){sp.textContent=node.speaker;typeText(node.text);idx++;return;}
  if(node.type==='choice'){
    locked=true;cp.style.display='flex';cq.textContent=node.question;cbs.innerHTML='';
    node.options.forEach(function(opt){
      var btn=document.createElement('button');btn.className='cb';btn.textContent=opt.text;
      btn.onclick=function(){score+=opt.score;upBar();clog.push({q:node.question,a:opt.text});btn.classList.add('sel');
        setTimeout(function(){cp.style.display='none';locked=false;idx++;advance();},350);};
      cbs.appendChild(btn);
    });return;
  }
  if(node.type==='scoreboard'){showOv('<div class="sec">比赛实况</div>'+sbH(node));return;}
  if(node.type==='comments'){showOv('<div class="sec">球迷声音</div>'+cmH(node));return;}
  if(node.type==='timeline'){showOv('<div class="sec">历史时间轴</div>'+tlH(node));return;}
  if(node.type==='hero'){showOv(heroH(node));return;}
  if(node.type==='card'){showOv(cardH(node));return;}
  if(node.type==='profile'){showOv('<div class="sec">人物档案</div>'+profH(node));return;}
  if(node.type==='ending'){showEnding();return;}
  idx++;advance();
}
document.getElementById('app').addEventListener('click',function(){
  if(cp.style.display==='flex')return;
  if(ov.style.display==='block')return;
  if(ep.style.display==='flex')return;
  advance();
});

{type:'narrate',text:'英格兰队长博比·穆尔走向皇家包厢，准备从伊丽莎白二世女王手中接过雷米特杯。'},
{type:'narrate',text:'他低头看了看自己的手——满是汗水和泥土。'},
{type:'narrate',text:'穆尔把手放在包厢的**天鹅绒布**上，使劲擦了几下，才伸手接过奖杯。'},
{type:'hero',emoji:'🦁',title:'博比·穆尔高举奖杯',subtitle:'英格兰历史上唯一一次\n站在世界足球之巅'},
{type:'choice',question:'穆尔在接奖杯前擦手这个细节，说明了什么？',options:[
  {text:'他很紧张，下意识的动作',score:10},
  {text:'对女王的尊重，即使在最激动的时刻也保持礼仪',score:25},
  {text:'职业习惯，运动员都会这样',score:5}
]},
{type:'narrate',text:'但就在英格兰队欢庆的同时，一个秘密正在悄悄上演……'},
{type:'profile',name:'彼得·韦斯顿',emoji:'👮',tags:['警员','水晶宫球迷','入职4个月'],bio:'决赛当天接受秘密任务：将真正的雷米特杯替换成复制品，让英格兰队用假杯庆祝，保护真杯安全。'},
{type:'narrate',text:'韦斯顿走进更衣室，找到了手持奖杯的诺比·斯泰尔斯。'},
{type:'dialog',speaker:'韦斯顿',text:'诺比，你拿着这个，把那个给我。'},
{type:'dialog',speaker:'斯泰尔斯',text:'好的。'},
{type:'narrate',text:'就这样，真正的雷米特杯被藏进了韦斯顿的汽车后备箱，随后存入伦敦市中心一家银行的金库。'},
{type:'choice',question:'英足总秘密替换奖杯，却不让球员妻子参加庆功宴，你如何评价？',options:[
  {text:'安保考虑合理，但对球员不够尊重',score:20},
  {text:'典型的官僚作风，本末倒置',score:15},
  {text:'时代背景不同，不能用现在的标准评判',score:20}
]},
