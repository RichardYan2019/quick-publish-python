<script>
var idx=0,score=0,clog=[],typing=null,locked=false,gameStarted=false;
var bg=document.getElementById('bg'),sp=document.getElementById('sp'),dt=document.getElementById('dt');
var db=document.getElementById('db'),cp=document.getElementById('cp'),cq=document.getElementById('cq');
var cbs=document.getElementById('cbs'),ov=document.getElementById('ov'),ovcon=document.getElementById('ovcon');
var ep=document.getElementById('ep'),sb=document.getElementById('sb'),ht=document.getElementById('ht');
document.getElementById('ovc').onclick=function(){ov.style.display='none';db.style.display='block';idx++;advance();};
function upBar(){sb.style.width=Math.min(100,Math.round(score/100*100))+'%';}
function bold(t){return t.replace(/\*\*([^*]+)\*\*/g,'<strong style="color:#f0c040">$1</strong>');}
function typeText(txt){
  if(typing)clearInterval(typing);
  dt.textContent='';
  var plain=txt.replace(/\*\*([^*]+)\*\*/g,'$1'),i=0;
  typing=setInterval(function(){
    if(i<plain.length){dt.textContent+=plain[i++];}
    else{clearInterval(typing);typing=null;dt.innerHTML=bold(txt);}
  },70);
}
function showOv(html){ovcon.innerHTML=html;ov.style.display='block';ov.scrollTop=0;db.style.display='none';}
function sbH(n){return '<div class="sbd"><div class="sm">'+n.minute+'</div><div class="sr"><div class="st"><div class="sn">'+n.home+'</div><div class="ss">'+n.homeScore+'</div></div><div class="sv">VS</div><div class="st"><div class="sn">'+n.away+'</div><div class="ss">'+n.awayScore+'</div></div></div><div class="se">'+n.event+'</div></div>';}
function cmH(n){return '<div class="cmw">'+n.posts.map(function(p){return '<div class="cm"><div class="cu">@'+p.user+'</div><div class="ct">'+p.text+'</div><div class="ck">👍 '+p.likes.toLocaleString()+'</div></div>';}).join('')+'</div>';}
function tlH(n){return '<div class="tl">'+n.events.map(function(e){return '<div class="tr"><div class="td"></div><div><div class="ty">'+e.year+'</div><div class="tt">'+e.text+'</div></div></div>';}).join('')+'</div>';}
function heroH(n){return '<div class="hw"><div class="he">'+n.emoji+'</div><div class="hti">'+n.title+'</div><div class="hs">'+n.subtitle+'</div></div>';}
function cardH(n){return '<div class="crd"><div class="crt">📁 '+n.title+'</div><div class="crx">'+n.text+'</div><div class="cre">▶ '+n.teaser+'</div></div>';}
function profH(n){return '<div class="pf"><div class="pe">'+n.emoji+'</div><div><div class="pn">'+n.name+'</div><div class="tgs">'+n.tags.map(function(t){return '<span class="tg">'+t+'</span>';}).join('')+'</div><div class="pb">'+n.bio+'</div></div></div>';}
function showEnding(){
  var badge,title,desc;
  if(score>=70){badge='🏆';title='深度理解者';desc='你穿透了表象，看见了那个时代的荣耀与阴影。1966年的故事，在你心中已经完整。';}
  else if(score>=40){badge='🔍';title='真相追寻者';desc='你触碰到了一部分真相。历史的每一个细节都值得深挖，欢迎再来一次。';}
  else{badge='👁️';title='旁观者';desc='每个故事都有更深的一面。足球不只是比赛，欢迎重新探索这段历史。';}
  var logHtml=clog.map(function(c){return '<div class="ci">Q: '+c.q+'<br><span>你选择：'+c.a+'</span></div>';}).join('');
  ep.innerHTML='<div class="eb">'+badge+'</div><div class="et">'+title+'</div><div class="ed">'+desc+'</div><div class="es">理解度：'+score+'/100分</div><div class="cl"><div class="sec">你的选择回顾</div>'+logHtml+'</div><button class="rb" onclick="location.reload()">重新体验</button>';
  ep.style.display='flex';
}
function advance(){
  if(locked)return;
  var node=script[idx];if(!node)return;
  if(typing){clearInterval(typing);typing=null;dt.innerHTML=bold(node.text||'');return;}
  ov.style.display='none';
  if(node.type==='scene'){bg.style.background=node.bg.startsWith("data:")?"url("+node.bg+") center/cover no-repeat":node.bg;ht.textContent=node.chapter;idx++;advance();return;}
  db.style.display='block';
  if(node.type==='narrate'){sp.textContent='';typeText(node.text);idx++;return;}
  if(node.type==='dialog'){sp.textContent=node.speaker;typeText(node.text);idx++;return;}
  if(node.type==='choice'){
    locked=true;cp.style.display='flex';cq.textContent=node.question;cbs.innerHTML='';
    node.options.forEach(function(opt){
      var btn=document.createElement('button');btn.className='cb';btn.textContent=opt.text;
      btn.onclick=function(){score+=opt.score;upBar();clog.push({q:node.question,a:opt.text});btn.classList.add('sel');
        setTimeout(function(){cp.style.display='none';locked=false;idx++;advance();},350);};
      cbs.appendChild(btn);
    });return;
  }
  if(node.type==='scoreboard'){showOv('<div class="sec">比赛实况</div>'+sbH(node));return;}
  if(node.type==='comments'){showOv('<div class="sec">球迷声音</div>'+cmH(node));return;}
  if(node.type==='timeline'){showOv('<div class="sec">历史时间轴</div>'+tlH(node));return;}
  if(node.type==='hero'){showOv(heroH(node));return;}
  if(node.type==='card'){showOv(cardH(node));return;}
  if(node.type==='profile'){showOv('<div class="sec">人物档案</div>'+profH(node));return;}
  if(node.type==='ending'){showEnding();return;}
  idx++;advance();
}
document.getElementById('app').addEventListener('click',function(){
  if(cp.style.display==='flex')return;
  if(ov.style.display==='block')return;
  if(ep.style.display==='flex')return;
  if(!gameStarted)return;
  advance();
});

{type:'narrate',text:'三年前，拉姆齐接手这支球队时，媒体都在嘲笑他的豪言壮语。但今天，他带着我们走到了这里。'},
{type:'narrate',text:'决赛前夜，拉姆齐面对战术板陷入沉思。英格兰的优势在哪里？如何才能压制西德的反击？'},
{type:'choice',question:'作为主教练，拉姆齐选择哪一种首发能最大发挥英格兰队的优势？',options:[
  {text:'传统4-4-2：两翼边锋强攻，以速度冲击西德两肋',score:5},
  {text:'无翼442：撤掉边锋，四中场压制，双前锋灵活跑位',score:20},
  {text:'4-3-3：三前锋全力进攻，用进球压力拖垮对手',score:10}
]},
{type:'narrate',text:'历史上，拉姆齐选择了"无翼442"——四名中场牢牢控制中路，让西德的边路进攻无从发力。媒体嘲笑这是"没有翅膀的球队"，但拉姆齐用结果证明了一切。'},

{type:'card',title:'历史档案·吉祥物"威利"',text:'本届世界杯首次出现赛事吉祥物——狮子"威利"，由插画家雷格·霍耶照着12岁儿子利奥的样子设计。上衣印着英国国旗，大受欢迎，引领了大型赛事周边产品的浪潮。',teaser:'下一章：决赛哨声响起，西德率先破门……'},

{type:'narrate',text:'英格兰队长博比·穆尔走向皇家包厢，准备从伊丽莎白二世女王手中接过雷米特杯。'},
{type:'narrate',text:'他低头看了看自己的手——满是汗水和泥土。'},
{type:'narrate',text:'穆尔把手放在包厢的**天鹅绒布**上，使劲擦了几下，才伸手接过奖杯。'},
{type:'hero',emoji:'🦁',title:'博比·穆尔高举奖杯',subtitle:'英格兰历史上唯一一次\n站在世界足球之巅'},
{type:'choice',question:'穆尔在接奖杯前擦手这个细节，说明了什么？',options:[
  {text:'他很紧张，下意识的动作',score:10},
  {text:'对女王的尊重，即使在最激动的时刻也保持礼仪',score:25},
  {text:'职业习惯，运动员都会这样',score:5}
]},
{type:'narrate',text:'但就在英格兰队欢庆的同时，一个秘密正在悄悄上演……'},
{type:'profile',name:'彼得·韦斯顿',emoji:'👮',tags:['警员','水晶宫球迷','入职4个月'],bio:'决赛当天接受秘密任务：将真正的雷米特杯替换成复制品，让英格兰队用假杯庆祝，保护真杯安全。'},
{type:'narrate',text:'韦斯顿走进更衣室，找到了手持奖杯的诺比·斯泰尔斯。'},
{type:'dialog',speaker:'韦斯顿',text:'诺比，你拿着这个，把那个给我。'},
{type:'dialog',speaker:'斯泰尔斯',text:'好的。'},
{type:'narrate',text:'就这样，真正的雷米特杯被藏进了韦斯顿的汽车后备箱，随后存入伦敦市中心一家银行的金库。'},
{type:'choice',question:'英足总秘密替换奖杯，却不让球员妻子参加庆功宴，你如何评价？',options:[
  {text:'安保考虑合理，但对球员不够尊重',score:20},
  {text:'典型的官僚作风，本末倒置',score:15},
  {text:'时代背景不同，不能用现在的标准评判',score:20}
]},
{type:'comments',posts:[
  {user:'乔治·科恩（夺冠球员，81岁）',text:'我震惊了。我竟然不知道这事，真是厚颜无耻！这不就是英足总的一贯作风吗？',likes:9876},
  {user:'足球历史迷',text:'斯泰尔斯至死都没告诉队友，2020年去世后才曝光',likes:5432},
  {user:'德国球迷',text:'所以连奖杯都是假的，这届世界杯真是……',likes:2341}
]},
